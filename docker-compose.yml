services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - "${RAG_PORT:-3200}:3200"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-rag}
      MODEL_NAME: ${MODEL_NAME:-intfloat/multilingual-e5-small}
      PROJECT_ID: ${PROJECT_ID:-qcms}
      PROJECT_NAME: ${PROJECT_NAME:-Q-CMS}
      PROJECT_BASE_PATH: /data
      DOCS_DIR: /data/docs
      SOURCES_DIR: /data/sources
      CONFIG_FILE: /data/index-config.json
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:7100/v1}
      VLLM_MODEL: ${VLLM_MODEL:-google/gemma-4-E4B-it}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # data/ 폴더 마운트 (docs, sources, config 모두 여기)
      - ./data:/data
      - model-cache:/root/.cache/huggingface

volumes:
  pgdata:
  model-cache:
