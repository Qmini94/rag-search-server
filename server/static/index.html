<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-CMS RAG 챗봇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
.header { background: #1a73e8; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
.header span { font-size: 13px; font-weight: 400; opacity: .8; margin-left: 8px; }
.chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.msg.bot code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.msg.bot pre { background: #f5f5f5; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.msg.bot pre code { background: none; padding: 0; }
.sources { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; font-size: 12px; color: #888; }
.sources div { margin: 2px 0; }
.input-area { padding: 16px 24px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; }
.input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
.input-area input:focus { border-color: #1a73e8; }
.input-area button { padding: 12px 24px; background: #1a73e8; color: #fff; border: none; border-radius: 24px; font-size: 14px; cursor: pointer; }
.input-area button:hover { background: #1557b0; }
.input-area button:disabled { background: #ccc; cursor: not-allowed; }
.typing { color: #888; font-style: italic; }
</style>
</head>
<body>
<div class="header">Q-CMS RAG 챗봇 <span>Q-CMS 솔루션 문서 기반 질의응답</span></div>
<div class="chat-area" id="chatArea">
  <div class="msg bot">안녕하세요! Q-CMS 관련 궁금한 점을 질문해주세요.</div>
</div>
<div class="input-area">
  <input type="text" id="questionInput" placeholder="질문을 입력하세요..." autocomplete="off">
  <button id="sendBtn" onclick="sendQuestion()">전송</button>
</div>
<script>
const chatArea = document.getElementById('chatArea');
const input = document.getElementById('questionInput');
const btn = document.getElementById('sendBtn');

input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) sendQuestion(); });

function addMsg(text, cls, sourcesHtml) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if(sourcesHtml) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.innerHTML = sourcesHtml;
    div.appendChild(s);
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

async function sendQuestion() {
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  addMsg(q, 'user');
  btn.disabled = true;
  const typing = addMsg('답변 생성 중...', 'bot typing');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question: q, top_k: 5 })
    });
    const data = await res.json();
    typing.remove();

    let sourcesHtml = '';
    if(data.sources && data.sources.length) {
      sourcesHtml = '<b>참고 문서:</b>' + data.sources.map(s =>
        `<div>${s.source} (${(s.similarity*100).toFixed(1)}%)</div>`
      ).join('');
    }
    addMsg(data.answer || data.detail || 'Error', 'bot', sourcesHtml);
  } catch(e) {
    typing.remove();
    addMsg('서버 연결 실패: ' + e.message, 'bot');
  }
  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
